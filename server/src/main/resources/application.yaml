server:
  port: 8080

spring:
    config:
      import:
        - optional:file:../.env[.properties]
        - optional:file:.env[.properties]
    data:
      mongodb:
        uri: ${MONGODB_URI}
    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID:NOT_SET}
              client-secret: ${GOOGLE_CLIENT_SECRET:NOT_SET}
              scope: profile, email
        
application:
    name: smart-campus-hub