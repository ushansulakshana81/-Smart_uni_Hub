server:
  port: 8080

spring:
    config:
      import:
        - optional:file:../.env[.properties]
        - optional:file:.env[.properties]
    data:
      mongodb:
        uri: ${MONGODB_URI}
    mail:
      host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
            starttls.protocol: TLSv1.2
    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID:NOT_SET}
              client-secret: ${GOOGLE_CLIENT_SECRET:NOT_SET}
              scope: profile, email
        
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationPurposeOnly123456789}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}

application:
    name: smart-campus-hub